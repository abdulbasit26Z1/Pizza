name: Build Android APK and AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Build Web App
      run: npm run build

    - name: Install Capacitor Packages
      run: npm i @capacitor/core @capacitor/cli @capacitor/android

    - name: Initialize Capacitor
      run: npx cap init Pizza com.azmeer.pizza --web-dir=dist --yes || true

    - name: Add Android Platform
      run: npx cap add android || true

    - name: Sync Capacitor
      run: npx cap sync

    - name: Prepare signing config
      run: |
        KEY_ALIAS=$(sed -n 's/^app_alias[[:space:]]*-[[:space:]]*//p' key.txt | head -n1 | xargs)
        KEY_PASSWORD=$(sed -n 's/^app_password[[:space:]]*-[[:space:]]*//p' key.txt | head -n1 | xargs)
        cat > android/keystore.properties <<EOF
        storeFile=../my-release-key.jks
        storePassword=${KEY_PASSWORD}
        keyAlias=${KEY_ALIAS}
        keyPassword=${KEY_PASSWORD}
        EOF
        python - <<'PY'
        from pathlib import Path
        gradle = Path("android/app/build.gradle")
        text = gradle.read_text()
        signing_block = '''    signingConfigs {
        release {
            def keystoreProperties = new Properties()
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
'''
        if "signingConfigs {" not in text:
            text = text.replace("android {\n", "android {\n" + signing_block, 1)
        if "signingConfig signingConfigs.release" not in text:
            text = text.replace("release {\n", "release {\n            signingConfig signingConfigs.release\n", 1)
        gradle.write_text(text)
        PY

    - name: Build signed Android APK & AAB
      run: |
        cd android
        ./gradlew assembleRelease
        ./gradlew bundleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android/app/build/outputs/apk/release/app-release.apk

    - name: Upload AAB Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: android/app/build/outputs/bundle/release/app-release.aab
